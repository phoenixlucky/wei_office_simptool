[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wei-data-shu"
version = "5.1.0"
description = "wei-data-shu: 面向办公自动化和数据处理的 Python 工具库 | Domain-oriented office automation & data utility toolkit for Python"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-only"
authors = [
  {name = "Ethan Wilkins", email = "thisluckyboy@126.com"}
]
keywords = ["office", "excel", "mysql", "email", "automation", "utilities"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
  "pandas>=2.0",
  "openpyxl>=3.1",
  "toml>=0.10",
  "mysql-connector-python>=8.0",
  "requests>=2.31",
]

[project.scripts]
wei-data-shu = "wei_data_shu.cli:main"

[project.optional-dependencies]
analysis = [
  "numpy",
  "matplotlib",
  "statsmodels",
  "jieba",
  "wordcloud"
]
excel-client = [
  "xlwings"
]

[project.urls]
Homepage = "https://github.com/phoenixlucky/wei-data-shu"
Repository = "https://github.com/phoenixlucky/wei-data-shu"
Issues = "https://github.com/phoenixlucky/wei-data-shu/issues"
Changelog = "https://github.com/phoenixlucky/wei-data-shu/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["wei_data_shu*"]
exclude = ["tests*", "build*", "dist*", "*.egg-info*"]
